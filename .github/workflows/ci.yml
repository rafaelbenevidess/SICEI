name: CI

on:
  push:
  pull_request:

jobs:
  qualidade:
    name: Lint, tipos e testes unitários
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Testes unitários com cobertura
        run: npm run test:relatorio
      - name: Relatório de testes (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-testes
          path: public/relatorio-testes
          retention-days: 30
      - run: npm run build:app

  integracao:
    name: Testes de integração (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      DIRECT_URL_TESTE: postgresql://sicei_dev_owner:sicei_dev_owner_senha@localhost:5432/sicei_teste
      DATABASE_URL_TESTE: postgresql://sicei_dev_app:sicei_dev_app_senha@localhost:5432/sicei_teste
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Papéis e banco de teste
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE sicei_dev_owner LOGIN PASSWORD 'sicei_dev_owner_senha' CREATEDB"
          psql -h localhost -U postgres -c "CREATE ROLE sicei_dev_app LOGIN PASSWORD 'sicei_dev_app_senha'"
          psql -h localhost -U postgres -c "CREATE DATABASE sicei_teste OWNER sicei_dev_owner"
      - run: npm ci
      - run: npm run test:integracao

  ponta-a-ponta:
    name: Testes ponta a ponta (Playwright)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Papéis e banco de teste
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE sicei_dev_owner LOGIN PASSWORD 'sicei_dev_owner_senha' CREATEDB"
          psql -h localhost -U postgres -c "CREATE ROLE sicei_dev_app LOGIN PASSWORD 'sicei_dev_app_senha'"
          psql -h localhost -U postgres -c "CREATE DATABASE sicei_e2e OWNER sicei_dev_owner"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:app
      - run: npm run test:e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
